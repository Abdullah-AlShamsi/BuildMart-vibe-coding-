<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard — BuildMart</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app-header"></div>

<section class="block container">
  <h1 style="margin-bottom:20px;">Admin Dashboard</h1>

  <div class="admin-tabs">
    <button class="tab-btn active" onclick="switchTab('dashboard')">Dashboard</button>
    <button class="tab-btn" onclick="switchTab('products')">Products</button>
    <button class="tab-btn" onclick="switchTab('categories')">Categories</button>
    <button class="tab-btn" onclick="switchTab('orders')">Orders</button>
    <button class="tab-btn" onclick="switchTab('customers')">Customers</button>
  </div>

  <div id="panel-dashboard" class="admin-panel active">
    <div id="stats-container"><div class="spinner">Loading stats...</div></div>
  </div>

  <div id="panel-products" class="admin-panel">
    <div class="admin-toolbar">
      <span></span>
      <button class="btn btn-primary" onclick="openProductModal()">+ Add Product</button>
    </div>
    <div id="products-table"><div class="spinner">Loading products...</div></div>
  </div>

  <div id="panel-categories" class="admin-panel">
    <div class="admin-toolbar">
      <span></span>
      <button class="btn btn-primary" onclick="openCategoryModal()">+ Add Category</button>
    </div>
    <div id="categories-table"><div class="spinner">Loading categories...</div></div>
  </div>

  <div id="panel-orders" class="admin-panel">
    <div id="orders-table"><div class="spinner">Loading orders...</div></div>
  </div>

  <div id="panel-customers" class="admin-panel">
    <div id="customers-table"><div class="spinner">Loading customers...</div></div>
  </div>
</section>

<!-- Product modal -->
<div class="modal-backdrop" id="product-modal-backdrop">
  <div class="modal">
    <h3 id="product-modal-title">Add Product</h3>
    <input type="hidden" id="pm-id">
    <div class="form-group"><label>Name</label><input id="pm-name"></div>
    <div class="form-group"><label>Description</label><textarea id="pm-description" rows="2"></textarea></div>
    <div class="form-row">
      <div class="form-group"><label>Price</label><input type="number" step="0.01" id="pm-price"></div>
      <div class="form-group"><label>Discount Price</label><input type="number" step="0.01" id="pm-discount"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Stock Quantity</label><input type="number" id="pm-stock"></div>
      <div class="form-group"><label>SKU</label><input id="pm-sku"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Category</label><select id="pm-category"></select></div>
      <div class="form-group"><label>Brand</label><input id="pm-brand"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Unit</label>
        <select id="pm-unit">
          <option>Piece</option><option>Kilogram</option><option>Liter</option>
          <option>Meter</option><option>Box</option><option>Bag</option><option>Set</option>
        </select>
      </div>
      <div class="form-group"><label>Weight (kg)</label><input type="number" step="0.01" id="pm-weight"></div>
    </div>
    <div class="form-group"><label>Image URL</label><input id="pm-image"></div>
    <div class="form-group"><label><input type="checkbox" id="pm-available" checked> Available for sale</label></div>
    <div id="product-modal-error" class="form-error" style="display:none;"></div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeProductModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveProduct()">Save</button>
    </div>
  </div>
</div>

<!-- Category modal -->
<div class="modal-backdrop" id="category-modal-backdrop">
  <div class="modal">
    <h3 id="category-modal-title">Add Category</h3>
    <input type="hidden" id="cm-id">
    <div class="form-group"><label>Name</label><input id="cm-name"></div>
    <div class="form-group"><label>Description</label><textarea id="cm-description" rows="2"></textarea></div>
    <div class="form-group"><label>Image URL</label><input id="cm-image"></div>
    <div id="category-modal-error" class="form-error" style="display:none;"></div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeCategoryModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveCategory()">Save</button>
    </div>
  </div>
</div>

<div id="app-footer"></div>

<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
