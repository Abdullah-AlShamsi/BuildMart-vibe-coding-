<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile — BuildMart</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app-header"></div>
<div class="form-page">
  <h2>My Profile</h2>
  <div id="profile-msg" style="display:none;"></div>
  <form onsubmit="return handleProfileUpdate(event)">
    <div class="form-group">
      <label>Full Name</label>
      <input type="text" id="p-fullname" required>
    </div>
    <div class="form-group">
      <label>Email (cannot be changed)</label>
      <input type="email" id="p-email" disabled>
    </div>
    <div class="form-group">
      <label>Phone Number</label>
      <input type="tel" id="p-phone">
    </div>
    <div class="form-group">
      <label>Address</label>
      <input type="text" id="p-address">
    </div>
    <div class="form-group">
      <label>City</label>
      <input type="text" id="p-city">
    </div>
    <button type="submit" class="btn btn-primary btn-block" id="profile-save-btn">Save Changes</button>
  </form>
</div>
<div id="app-footer"></div>
<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
