<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — BuildMart</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app-header"></div>
<div class="form-page">
  <h2>Create your account</h2>
  <div id="register-error" class="alert alert-error" style="display:none;"></div>
  <form onsubmit="return handleRegister(event)">
    <div class="form-group">
      <label>Full Name</label>
      <input type="text" id="reg-fullname" required>
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="reg-email" required>
    </div>
    <div class="form-group">
      <label>Phone Number</label>
      <input type="tel" id="reg-phone">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="reg-password" required>
      </div>
      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" id="reg-confirm" required>
      </div>
    </div>
    <button type="submit" class="btn btn-primary btn-block" id="register-btn">Create Account</button>
  </form>
  <div class="switch-link">Already have an account? <a href="login.html">Login</a></div>
</div>
<div id="app-footer"></div>
<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script src="js/register.js"></script>
</body>
</html>
