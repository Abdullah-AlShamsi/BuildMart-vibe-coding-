<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout — BuildMart</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app-header"></div>

<section class="block container">
  <h1 style="margin-bottom:20px;">Checkout</h1>
  <div class="cart-layout">
    <div>
      <div class="summary-card" id="checkout-error-box" style="display:none; margin-bottom:16px;"></div>
      <form id="checkout-form" class="summary-card" onsubmit="return submitOrder(event)">
        <h3>Shipping & Payment</h3>
        <div class="form-group">
          <label>Shipping Address</label>
          <textarea id="shipping-address" rows="3" required placeholder="Street, City, Building, Apt..."></textarea>
        </div>
        <div class="form-group">
          <label>Phone Number</label>
          <input type="tel" id="phone-number" required placeholder="e.g. +968 9xxxxxxx">
        </div>
        <div class="form-group">
          <label>Payment Method</label>
          <select id="payment-method">
            <option value="CashOnDelivery">Cash on Delivery</option>
            <option value="CreditCard">Credit Card</option>
            <option value="BankTransfer">Bank Transfer</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="place-order-btn">Place Order</button>
      </form>
    </div>
    <div id="order-summary"><div class="spinner">Loading summary...</div></div>
  </div>
</section>

<div id="app-footer"></div>

<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script src="js/checkout.js"></script>
</body>
</html>
